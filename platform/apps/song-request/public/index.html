<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Request a song</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; margin: 0; padding: 16px; color: #111; }
  h2 { margin: 0 0 12px; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; opacity: .6; }
  input, button { font: inherit; width: 100%; box-sizing: border-box; padding: 11px 12px; border-radius: 9px; }
  input { border: 1px solid #ccc; margin-bottom: 8px; }
  button { border: 0; background: #111; color: #fff; font-weight: 600; }
  .said { padding: 12px 0; color: #067647; font-weight: 600; }
</style>

<h2>Request a song</h2>
<form id="form">
  <input name="song" placeholder="What do you want to hear?" required maxlength="120">
  <input name="requested_by" placeholder="Your name" maxlength="80">
  <input name="contact" type="email" placeholder="Email (optional)" maxlength="160">
  <button type="submit">Send request</button>
</form>
<div id="said" class="said" hidden>Thanks — your request is in.</div>

<script type="module">
  // The SDK is served by the platform, and the platform tells the frame where
  // it lives. An app never hard-codes a platform address.
  const platform = new URLSearchParams(location.search).get('cc_platform');
  const { connect } = await import(`${platform}/sdk/app.js`);
  const cc = await connect({ platform });
  const form = document.getElementById('form');
  cc.resize();

  form.addEventListener('submit', async event => {
    event.preventDefault();
    const values = Object.fromEntries(new FormData(form));

    const row = await cc.table('requests').create({
      song: values.song,
      requested_by: values.requested_by || null,
      contact: values.contact || null,
      status: 'pending',
    });

    // Optional permissions are optional at runtime too. An app that assumes it
    // has one it was not granted is an app that breaks for half its installs.
    if (values.contact && cc.can('contacts.write')) {
      await cc.contacts.upsert({ name: values.requested_by || values.contact, email: values.contact, tags: ['song-request'] });
    }
    if (cc.can('events.emit')) {
      await cc.emit('song_request.created', { id: row.id, song: row.song, by: row.requested_by });
    }

    form.hidden = true;
    document.getElementById('said').hidden = false;
    cc.resize();
  });
</script>
